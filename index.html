<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarlet Wishes</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./interface.css" />
  <link rel="stylesheet" href="./transition.css" />
  <script>
    (() => {
      const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
      if (location.protocol === 'http:' && !window.isSecureContext && !localHosts.has(location.hostname)) {
        const port = location.port ? `:${location.port}` : '';
        location.replace(`http://localhost${port}${location.pathname}${location.search}${location.hash}`);
      }
    })();
  </script>
  <style>
    #sceneFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
      visibility: hidden;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <main id="coverStage" class="cover-stage" aria-label="Scarlet Wishes cover page">
    <div class="cover-layer cover-bg" aria-hidden="true"></div>
    <div class="cover-layer scarlet-wishes" aria-hidden="true"></div>
    <button id="pushStart" class="push-start" type="button">PUSH START</button>
  </main>

  <iframe id="sceneFrame" title="Scarlet Wishes" allow="camera; autoplay; fullscreen"></iframe>

  <script src="./scarlet-audio.js"></script>
  <script src="./interface.js"></script>
  <script src="./transition.js"></script>
  <script src="./sketch.js"></script>
  <script>
    (() => {
      const frame = document.getElementById('sceneFrame');
      frame.addEventListener('load', () => {
        const src = frame.getAttribute('src') || '';
        window.ScarletAudio?.notifyScene?.(src);
      });
      window.ScarletAudio?.notifyScene?.('index.html');
    })();
  </script>
</body>
</html>
