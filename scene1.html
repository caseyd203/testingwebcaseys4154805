<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarlet Wishes — Scene 1</title>
  <link rel="stylesheet" href="./scene1.css" />
  <link rel="stylesheet" href="./interface.css" />
  <script>try{if(sessionStorage.getItem('entanglement:wipe-open')==='1')document.documentElement.classList.add('scene-wipe-pending')}catch(e){}</script>
  <link rel="stylesheet" href="./transition.css" />
</head>
<body>
  <main id="scene1Stage" class="scene-stage">
    <canvas id="scene1KaleidoBg" class="scene1-kaleido-bg" aria-hidden="true"></canvas>
    <div class="scene-image panel-text" aria-hidden="true"></div>
    <div class="scene-image diamond-main" aria-hidden="true"></div>
    <div class="scene-image diamond-slice" aria-hidden="true"></div>

    <div id="dialogueText" class="dialogue-text" aria-live="polite"></div>
    <div id="continuePrompt" class="continue-prompt">CLICK TO ALTERNATE | PRESS “C” TO CONTINUE</div>

    <div id="choiceGroup" class="choice-group" aria-hidden="true">
      <button id="yesChoice" class="choice choice-yes" type="button">&gt; YES</button>
      <button id="noChoice" class="choice choice-no" type="button">&gt; NO</button>
    </div>
  </main>
    <script src="./scarlet-audio.js"></script>
  <script src="./interface.js"></script>
<script src="./scene1-kaleido.js"></script>
<script src="./scene1.js"></script>
  <script src="./transition.js"></script>
</body>
</html>
